        .channel-menu {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px); border: 1px solid #444; border-radius: 12px;
            padding: 20px; z-index: 99999; flex-direction: column; gap: 10px;
            min-width: 260px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .channel-menu.active { display: flex; animation: popIn 0.2s ease-out; }
        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .channel-menu-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #444; padding-bottom: 12px; margin-bottom: 10px;
        }
        .channel-menu-header h3 { margin: 0; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; }
        .close-btn { cursor: pointer; color: #ff4d4d; font-size: 26px; line-height: 1; font-weight: bold; transition: 0.2s; }
        .close-btn:hover { color: #ff1a1a; transform: scale(1.1); }
        .channel-menu-item {
            display: flex; align-items: center; gap: 15px; padding: 10px 15px;
            background: #2b2b2b; border-radius: 8px; cursor: pointer; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 15px; font-weight: bold; transition: all 0.2s ease; border: 1px solid transparent;
        }
        .channel-menu-item:hover { background: #3a3a3a; }
        .channel-menu-item.active-item { background: #1dcf60; border-color: #1dcf60; color: #000; }
        
        .channel-menu-item img {
            width: 40px; height: 25px; border-radius: 4px; background: transparent; 
            padding: 2px; object-fit: contain; box-sizing: border-box;
        }

        /* Quality menu */
        .quality-menu {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: rgba(20,20,20,0.96);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px;
            z-index: 999999;
            min-width: 160px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            direction: ltr;
        }
        .quality-menu.active { display: block; }
        .quality-item {
            padding: 8px 12px;
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 4px 0;
            background: transparent;
        }
        .quality-item:hover { background: #333; }
        .quality-item.active-quality { background: #1dcf60; color: #000; border: 1px solid #1dcf60; }

            playlist: playlist,
            width: "100%",
            height: "100%",
            autostart: true,
            stretching: "uniform"
        });

        // helper: map playlist indices which have multiple qualities
        const qualitiesByIndex = {};
        // Because we inserted multiQualityChannels first, their indices are 0..N-1
        multiQualityChannels.forEach((ch, idx) => {
            qualitiesByIndex[idx] = ch.qualities;
        });

        function toggleMenu() {
            const menu = document.getElementById('customChannelMenu');
            if(menu) menu.classList.toggle('active');
        }

        function changeChannel(index) {
            if(playerInstance.getPlaylistIndex() === index) {
                toggleMenu();
                return;
            }
            const items = document.querySelectorAll('.channel-menu-item');
            items.forEach((el, i) => {
                if(i === index) el.classList.add('active-item');
                else el.classList.remove('active-item');
            });
            // If this channel has qualities defined in qualitiesByIndex, load default quality (first)
            if(qualitiesByIndex[index]) {
                // load chosen quality (default to first)
                const q = qualitiesByIndex[index][0];
                playerInstance.load([{ title: playlist[index].title || '', file: q.url, type: 'hls' }]);
                playerInstance.play();
            } else {
                // load by playlist index
                playerInstance.playlistItem(index);
            }
            // hide menus
            toggleMenu();
            hideQualityMenu();
        }

        // إظهار القائمة أوتوماتيك لو البث فاصل
        playerInstance.on('error', function(e) {
            const menu = document.getElementById('customChannelMenu');
            if(menu && !menu.classList.contains('active')) {
                menu.classList.add('active');
            }
        });

        // quality menu logic
        function createQualityMenu() {
            const qm = document.createElement('div');
            qm.id = 'customQualityMenu';
            qm.className = 'quality-menu';
            qm.innerHTML = '<div id="qualityItems"></div>';
            document.body.appendChild(qm);
            return qm;
        }
        function showQualityMenu(items, activeLabel) {
            let qm = document.getElementById('customQualityMenu');
            if(!qm) qm = createQualityMenu();
            const container = qm.querySelector('#qualityItems');
            container.innerHTML = '';
            items.forEach(it => {
                const el = document.createElement('div');
                el.className = 'quality-item' + (it.label === activeLabel ? ' active-quality' : '');
                el.textContent = it.label;
                el.onclick = function(e) {
                    // load chosen quality
                    playerInstance.load([{ title: playlist[playerInstance.getPlaylistIndex()]?.title || '', file: it.url, type: 'hls' }]);
                    playerInstance.play();
                    // mark active
                    const all = container.querySelectorAll('.quality-item');
                    all.forEach(a => a.classList.remove('active-quality'));
                    el.classList.add('active-quality');
                    hideQualityMenu();
                };
                container.appendChild(el);
            });
            qm.classList.add('active');
        }
        function hideQualityMenu() {
            const qm = document.getElementById('customQualityMenu');
            if(qm) qm.classList.remove('active');
        }

        playerInstance.on('ready', function() {

            const listIcon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNCA2aDE2TTQgMTJoMTZNNCAxOGgxNiIvPjwvc3ZnPg==";

            let menuHtml = `

                const overallIndex = baseIndex + idx;
                menuHtml += `
                    <div class="channel-menu-item" onclick="changeChannel(${overallIndex})">
                        <img src="${o.logo}" alt="Icon">
                        <span>${o.title}</span>
                    </div>
                `;
            });

            menuHtml += `</div>`;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = menuHtml;
            document.body.appendChild(tempDiv.firstElementChild);

            // create quality menu element (hidden)
            if(!document.getElementById('customQualityMenu')) createQualityMenu();

            // when the playlist item changes, update active class in menu and show/hide quality button if needed
            playerInstance.on('playlistItem', function() {
                const idx = playerInstance.getPlaylistIndex();
                // update menu active state
                const items = document.querySelectorAll('.channel-menu-item');
                items.forEach((el, i) => {
                    if(i === idx) el.classList.add('active-item');
                    else el.classList.remove('active-item');
                });
                // hide quality menu and update visibility/tooltip
                hideQualityMenu();
                const qb = document.querySelector('.jw-controlbar .jw-button.quality-button, .jw-controlbar .jw-button[title="الجودة"]');
                // cannot reliably access JW internal DOM class across versions; instead we keep our button but only show meaningful menu if qualities exist
                // nothing to do here besides keeping custom button; its click handler checks qualitiesByIndex
            });
        });

        // click outside quality menu closes it
        document.addEventListener('click', function(e) {
            const qm = document.getElementById('customQualityMenu');
            if(!qm) return;
            if(qm.classList.contains('active')) {
                // if click is outside the quality menu and not on the quality-button, close
                const qBtn = document.querySelector('.jw-controlbar .jw-button.quality-button, .jw-button[title="الجودة"]');
                if(qBtn && (qBtn.contains(e.target) || e.target === qBtn)) return;
                if(!qm.contains(e.target)) qm.classList.remove('active');
            }
        });

    </script>
</body>
</html>
