<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>On Sport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="On Sport">
    
    <!-- الرابط الأصلي بتاعك اللي اشتغل بدون أي تعديل مني -->
    <link rel="icon" href="https://play-lh.googleusercontent.com/ScrEK-542jVYYYzxn8PMxJGkc61u33koK1FM9v0rdNcWEuQeP2GqaO-N-t5sffMvdQCuZa6J7Npbcwzw3kkLP_c=w240-h480-rw" type="image/png">
    <link rel="apple-touch-icon" href="https://play-lh.googleusercontent.com/ScrEK-542jVYYYzxn8PMxJGkc61u33koK1FM9v0rdNcWEuQeP2GqaO-N-t5sffMvdQCuZa6J7Npbcwzw3kkLP_c=w240-h480-rw">
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
        }
        #player { 
            width: 100%; height: 100%; position: absolute; 
            top: 0; right: 0; bottom: 0; left: 0;
        }

        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=');
            background-size: 55%; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTUtMlYzbTAgMThoM2EyIDIgMCAwIDEgMiAydjMiLz48L3N2Zz4=');
        }
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }

        .channel-menu {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px); border: 1px solid #444; border-radius: 12px;
            padding: 20px; z-index: 99999; flex-direction: column; gap: 10px;
            min-width: 260px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .channel-menu.active { display: flex; animation: popIn 0.2s ease-out; }
        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .channel-menu-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #444; padding-bottom: 12px; margin-bottom: 10px;
        }
        .channel-menu-header h3 { margin: 0; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; }
        .close-btn { cursor: pointer; color: #ff4d4d; font-size: 26px; line-height: 1; font-weight: bold; transition: 0.2s; }
        .close-btn:hover { color: #ff1a1a; transform: scale(1.1); }
        .channel-menu-item {
            display: flex; align-items: center; gap: 15px; padding: 10px 15px;
            background: #2b2b2b; border-radius: 8px; cursor: pointer; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 15px; font-weight: bold; transition: all 0.2s ease; border: 1px solid transparent;
        }
        .channel-menu-item:hover { background: #3a3a3a; }
        .channel-menu-item.active-item { background: #1dcf60; border-color: #1dcf60; color: #000; }
        
        /* تظبيط شكل أيقونة الـ SVG الداخلية */
        .channel-menu-item img {
            width: 40px; height: 25px; border-radius: 4px; background: transparent; 
            padding: 2px; object-fit: contain; box-sizing: border-box;
        }
    </style>
    
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
</head>
<body>

    <div id="player"></div>

    <script>
        const playerInstance = jwplayer("player").setup({
            "playlist": [
                {
                    "title": "On Sport HD",
                    "file": "https://fastly.live.brightcove.com/6386028928112/us-east-1/6416013238001/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJob3N0IjoieWN3Ymx1LmVncmVzcy5zenkzeHgiLCJhY2NvdW50X2lkIjoiNjQxNjAxMzIzODAwMSIsImVobiI6ImZhc3RseS5saXZlLmJyaWdodGNvdmUuY29tIiwiaXNzIjoiYmxpdmUtcGxheWJhY2stc291cmNlLWFwaSIsInN1YiI6InBhdGhtYXB0b2tlbiIsImF1ZCI6WyI2NDE2MDEzMjM4MDAxIl0sImp0aSI6IjYzODYwMjg5MjgxMTIifQ.7pBZHXb93BJ47HBrEiPQvSquoHi92NStYSX3JKYcznQ/chunklist.m3u8",
                    "type": "hls"
                },
                {
                    "title": "On Sport Max",
                    "file": "https://fastly.live.brightcove.com/6386027187112/us-east-1/6416013238001/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJob3N0IjoieWN3Ymx1LmVncmVzcy5zenkzeHgiLCJhY2NvdW50X2lkIjoiNjQxNjAxMzIzODAwMSIsImVobiI6ImZhc3RseS5saXZlLmJyaWdodGNvdmUuY29tIiwiaXNzIjoiYmxpdmUtcGxheWJhY2stc291cmNlLWFwaSIsInN1YiI6InBhdGhtYXB0b2tlbiIsImF1ZCI6WyI2NDE2MDEzMjM4MDAxIl0sImp0aSI6IjYzODYwMjcxODcxMTIifQ.o9bQYbACQ386kDSKbOPBVYlIhCz3WFgEHI3A8Pcw3qg/chunklist.m3u8",
                    "type": "hls"
                },
                {
                    "title": "On Sport Plus",
                    "file": "https://fastly.live.brightcove.com/6384149663112/us-east-1/6416013238001/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJob3N0IjoieWN3Ymx1LmVncmVzcy5zenkzeHgiLCJhY2NvdW50X2lkIjoiNjQxNjAxMzIzODAwMSIsImVobiI6ImZhc3RseS5saXZlLmJyaWdodGNvdmUuY29tIiwiaXNzIjoiYmxpdmUtcGxheWJhY2stc291cmNlLWFwaSIsInN1YiI6InBhdGhtYXB0b2tlbiIsImF1ZCI6WyI2NDE2MDEzMjM4MDAxIl0sImp0aSI6IjYzODQxNDk2NjMxMTIifQ.0yJpNEV0ZSId11mURgeaOhXZvov07Uj-VI_0qt0LLSQ/chunklist.m3u8",
                    "type": "hls"
                }
            ],
            "width": "100%",
            "height": "100%",
            "autostart": true,
            "stretching": "uniform"
        });

        function toggleMenu() {
            const menu = document.getElementById('customChannelMenu');
            if(menu) menu.classList.toggle('active');
        }

        function changeChannel(index) {
            if(playerInstance.getPlaylistIndex() === index) {
                toggleMenu();
                return;
            }
            const items = document.querySelectorAll('.channel-menu-item');
            items.forEach((el, i) => {
                if(i === index) el.classList.add('active-item');
                else el.classList.remove('active-item');
            });
            playerInstance.playlistItem(index);
            toggleMenu();
        }

        playerInstance.on('ready', function() {
            const listIcon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNCA2aDE2TTQgMTJoMTZNNCAxOGgxNiIvPjwvc3ZnPg==";
            
            playerInstance.addButton(listIcon, "قائمة القنوات", function() { toggleMenu(); }, "channels-button");

            let isStretched = false;
            const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

            playerInstance.addButton(
                diagonalCutArrow, "توسيع/تضييق الصورة", 
                function() {
                    if (!isStretched) {
                        playerInstance.setConfig({ stretching: "exactfit" }); isStretched = true;
                    } else {
                        playerInstance.setConfig({ stretching: "uniform" }); isStretched = false;
                    }
                }, "stretch-button"
            );

            const playerContainer = playerInstance.getContainer();
            
            // اللوجو الفيكتور (SVG) الداخلي للقائمة
            const logoUrl = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'%3E%3Cpath d='M0 0l70 30L0 60z' fill='%23cbf128'/%3E%3Ctext x='7' y='38' font-family='Arial' font-weight='bold' font-size='22' fill='%23000'%3EON%3C/text%3E%3Ctext x='75' y='40' font-family='Arial' font-weight='bold' font-style='italic' font-size='35' fill='%23fff' stroke='%23000' stroke-width='1.5'%3Esport%3C/text%3E%3C/svg%3E"; 
            
            const menuHtml = `
                <div id="customChannelMenu" class="channel-menu" dir="rtl">
                    <div class="channel-menu-header">
                        <h3>باقة On Sport</h3>
                        <span class="close-btn" onclick="toggleMenu()">&times;</span>
                    </div>
                    <div class="channel-menu-item active-item" onclick="changeChannel(0)">
                        <img src="${logoUrl}" alt="Icon">
                        <span>On Sport HD</span>
                    </div>
                    <div class="channel-menu-item" onclick="changeChannel(1)">
                        <img src="${logoUrl}" alt="Icon">
                        <span>On Sport Max</span>
                    </div>
                    <div class="channel-menu-item" onclick="changeChannel(2)">
                        <img src="${logoUrl}" alt="Icon">
                        <span>On Sport Plus</span>
                    </div>
                </div>
            `;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = menuHtml;
            playerContainer.appendChild(tempDiv.firstElementChild);
        });
    </script>
</body>
</html>
