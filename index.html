        function toggleMenu() {
            const menu = document.getElementById('customChannelMenu');
            if(menu) {
                menu.classList.toggle('active');
                const qMenu = document.getElementById('customQualityMenu');
                if(qMenu && qMenu.classList.contains('active')) qMenu.classList.remove('active');
            }
        }

        window.toggleQualityMenu = function() {
            const menu = document.getElementById('customQualityMenu');
            if(menu) {
                if(!menu.classList.contains('active')) {
                    renderQualityMenu(playerInstance.getPlaylistIndex());
                }
                menu.classList.toggle('active');
                const cMenu = document.getElementById('customChannelMenu');
                if(cMenu && cMenu.classList.contains('active')) cMenu.classList.remove('active');
            }
        };

        window.renderQualityMenu = function(chIndex) {
            const container = document.getElementById('customQualityMenu');
            container.innerHTML = '';
            if(!window.customQualities[chIndex]) return;
            
            window.customQualities[chIndex].forEach((q, qIndex) => {
                let div = document.createElement('div');
                div.className = 'jw-settings-item' + (window.activeQualities[chIndex] === qIndex ? ' active-item' : '');
                div.innerHTML = q.label;
                div.onclick = function() { changeQuality(chIndex, qIndex); };
                container.appendChild(div);
            });
        };

        window.changeQuality = function(chIndex, qIndex) {
            if (window.activeQualities[chIndex] === qIndex) {
                toggleQualityMenu();
                return;
            }
            window.activeQualities[chIndex] = qIndex;
            
            let qUrl = window.customQualities[chIndex][qIndex].isAuto 
                       ? getAutoQualityUrl(window.customQualities[chIndex]) 
                       : window.customQualities[chIndex][qIndex].url;
            
            let currentList = playerInstance.getPlaylist();
            let newList = [];
            for(let i = 0; i < currentList.length; i++) {
                newList.push({
                    title: currentList[i].title,
                    file: (i === chIndex) ? qUrl : currentList[i].file,
                    type: currentList[i].type || "hls"
                });
            }
            
            let currentTime = playerInstance.getPosition();
            
            playerInstance.load(newList);
            playerInstance.playlistItem(chIndex);
            
            playerInstance.once('play', function() {
                if (currentTime > 0) {
                    playerInstance.seek(currentTime);
                }
            });
            playerInstance.play();
            
            toggleQualityMenu();
        };

            const menuHtml = `
                <div id="customChannelMenu" class="channel-menu" dir="rtl">

        function updateQualityButtons(index) {
            const hasManualQualities = Array.isArray(window.customQualities[index])
                && window.customQualities[index].some(q => q.url);
            const playerElement = document.getElementById('player');
            if (playerElement) {
                playerElement.classList.toggle('manual-quality', hasManualQualities);
            }
            const customButton = document.querySelector('[button="quality-button"]');
            if (customButton) {
                customButton.style.setProperty('display', hasManualQualities ? '' : 'none',
                    hasManualQualities ? '' : 'important');

        playerInstance.on('playlistItem', function(e) {

        /* ===== فحص حالة القنوات (بيتأكد إن البث بيتحدث فعلاً) ===== */
        const CHECK_TIMEOUT = 8000;
        let lastCheck = 0, checking = false;

        function fetchT(url) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), CHECK_TIMEOUT);
            return fetch(url, { signal: c.signal, cache: 'no-store' }).finally(() => clearTimeout(t));
        }

        // يجيب media playlist (ولو الرابط master يدخل على أول playlist فرعي) ويحلله
        async function getMedia(url) {
            let r = await fetchT(url);
            if (!r.ok) return null;
            let txt = await r.text();
            if (!txt.includes('#EXTM3U')) return null;
            let base = r.url || url;

            if (txt.includes('#EXT-X-STREAM-INF')) {
                const lines = txt.split('\n').map(s => s.trim());
                const i = lines.findIndex(l => l.startsWith('#EXT-X-STREAM-INF'));
                const sub = lines.slice(i + 1).find(l => l && !l.startsWith('#'));
                if (!sub) return null;
                base = new URL(sub, base).href;
                r = await fetchT(base);
                if (!r.ok) return null;
                txt = await r.text();
                if (!txt.includes('#EXTM3U')) return null;
                base = r.url || base;
            }

            const segs = txt.split('\n').map(s => s.trim()).filter(l => l && !l.startsWith('#'));
            const seqM = txt.match(/#EXT-X-MEDIA-SEQUENCE:\s*(\d+)/);
            const tdM = txt.match(/#EXT-X-TARGETDURATION:\s*(\d+)/);
            return {
                url: base,
                segs: segs,
                lastUri: segs.length ? segs[segs.length - 1] : '',
                lastSeq: seqM ? Number(seqM[1]) + segs.length - 1 : null,
                target: tdM ? Number(tdM[1]) : 6,
                ended: txt.includes('#EXT-X-ENDLIST')
            };
        }

        // يرجع: 'ok' بث حي بيتحدث | 'bad' واقف أو منتهي | 'unk' مش معروف (غالباً CORS أو الرابط ميت)
        async function checkUrl(url) {
            try {
                const a = await getMedia(url);
                if (!a || !a.segs.length || a.ended) return 'bad';

                // آخر segment لازم يرد
                const sr = await fetchT(new URL(a.lastUri, a.url).href);
                const segOk = sr.ok;
                if (sr.body) sr.body.cancel();
                if (!segOk) return 'bad';

                // نستنى مدة segment تقريباً ونقارن: لو مفيش segment جديد يبقى البث واقف
                const wait = Math.min(Math.max(a.target * 1000 + 500, 5000), 12000);
                await new Promise(res => setTimeout(res, wait));

                const b = await getMedia(a.url);
                if (!b || !b.segs.length || b.ended) return 'bad';

                const moved = (a.lastSeq !== null && b.lastSeq !== null)
                    ? b.lastSeq > a.lastSeq
                    : b.lastUri !== a.lastUri;
                return moved ? 'ok' : 'bad';
            } catch (e) {
                return e.name === 'AbortError' ? 'bad' : 'unk';
            }
        }

        async function checkChannel(i) {
            const q = window.customQualities[i];
            const urls = q ? q.filter(x => x.url).map(x => x.url) : [playerInstance.getPlaylist()[i].file];
            const res = await Promise.all(urls.map(checkUrl));
            if (res.includes('ok')) return 'ok';
            if (res.includes('unk')) return 'unk';
            return 'bad';
        }

        async function runChecks() {
            if (checking) return;
            checking = true;
            const menuImgs = Array.from(document.querySelectorAll('#customChannelMenu .channel-menu-item img'));
            const homeImgs = Array.from(document.querySelectorAll('#homeScreen .home-card img'));
            const apply = (i, cls) => {
                if (menuImgs[i]) menuImgs[i].className = cls;
                if (homeImgs[i]) homeImgs[i].className = cls;
            };
            menuImgs.forEach((_, i) => apply(i, 'st-wait'));
            await Promise.all(menuImgs.map(async (_, i) => {
                const s = await checkChannel(i);
                apply(i, 'st-' + s);
            }));
            lastCheck = Date.now();
            checking = false;
        }

        /* ===== الشاشة الرئيسية ===== */
        function syncMenuActive(idx) {
            document.querySelectorAll('#customChannelMenu .channel-menu-item').forEach((el, i) => {
                el.classList.toggle('active-item', i === idx);
            });
        }

        function showHome() {
            const h = document.getElementById('homeScreen');
            if (!h) return;
            playerInstance.pause();
            h.classList.add('show');
            const m = document.getElementById('customChannelMenu');
            if (m) m.classList.remove('active');
            if (Date.now() - lastCheck > 30000) runChecks();
        }

        function hideHome() {
            const h = document.getElementById('homeScreen');
            if (h) h.classList.remove('show');
        }

        function openFromHome(i) {
            hideHome();
            syncMenuActive(i);
            playerInstance.playlistItem(i);
            playerInstance.play();
        }

        playerInstance.on('playlistItem', function (e) { syncMenuActive(e.index); });

        // نفحص لما القائمة تتفتح (بحد أدنى 30 ثانية بين كل فحص)
        const _origToggleMenu = toggleMenu;
        toggleMenu = function () {
            _origToggleMenu();
            const menu = document.getElementById('customChannelMenu');
            if (menu && menu.classList.contains('active') && Date.now() - lastCheck > 30000) runChecks();
        };

        playerInstance.on('ready', function () {
            const menuEl = document.getElementById('customChannelMenu');
            const header = menuEl ? menuEl.querySelector('.channel-menu-header') : null;
            if (header) {
                // نشيل عنوان "باقة القنوات" ونحط مكانه: أيقونة الديسكتوب + الشاشة الرئيسية + ريفريش
                const h3 = header.querySelector('h3');
                if (h3) h3.remove();

                const endGroup = document.createElement('div');
                endGroup.className = 'menu-head-group';

                const hb = document.createElement('div');
                hb.className = 'home-menu-btn';
                hb.innerHTML = '<img src="https://play-lh.googleusercontent.com/ScrEK-542jVYYYzxn8PMxJGkc61u33koK1FM9v0rdNcWEuQeP2GqaO-N-t5sffMvdQCuZa6J7Npbcwzw3kkLP_c=w240-h480-rw" alt=""><span>الشاشة الرئيسية</span>';
                hb.onclick = showHome;

                const rb = document.createElement('span');
                rb.className = 'refresh-btn';
                rb.title = 'إعادة فحص';
                rb.textContent = '↻';
                rb.onclick = runChecks;

                header.insertBefore(hb, header.firstChild);
                endGroup.appendChild(rb);
                const cb = header.querySelector('.close-btn');
                if (cb) endGroup.appendChild(cb);
                header.appendChild(endGroup);
            }

            // بناء الشاشة الرئيسية من نفس عناصر القائمة (نفس الأيقونات والأسماء)
            const items = document.querySelectorAll('#customChannelMenu .channel-menu-item');
            const home = document.createElement('div');
            home.id = 'homeScreen';
            home.setAttribute('dir', 'rtl');
            home.innerHTML =
                '<div class="glass-box">' +
                '<div class="home-top"><h1>On Sport &amp; Kora Plus</h1><span class="refresh-btn" title="إعادة فحص">↻</span></div>' +
                '<div class="home-grid"></div>' +
                '<div class="home-legend">' +
                '<span><i style="background:#1dcf60"></i>بث شغال</span>' +
                '<span><i style="background:#ff3b3b"></i>متوقف</span>' +
                '<span><i style="background:#999"></i>غير معروف</span>' +
                '</div></div>';
            home.querySelector('.refresh-btn').onclick = runChecks;
            const grid = home.querySelector('.home-grid');
            items.forEach((it, i) => {
                const card = document.createElement('div');
                card.className = 'home-card';
                const img = document.createElement('img');
                img.src = it.querySelector('img').src;
                img.alt = '';
                const name = document.createElement('span');
                name.textContent = it.querySelector('span').textContent;
                card.appendChild(img);
                card.appendChild(name);
                card.onclick = function () { openFromHome(i); };
                grid.appendChild(card);
            });
            const container = document.querySelector('.jwplayer') || document.body;
            container.appendChild(home);
            home.classList.add('show');
            runChecks();
        });

        
// تحديث تلقائي كل دقيقة ونص والقائمة أو الشاشة الرئيسية ظاهرة
        setInterval(() => {
            const menu = document.getElementById('customChannelMenu');
            const home = document.getElementById('homeScreen');
            if ((menu && menu.classList.contains('active')) || (home && home.classList.contains('show'))) runChecks();
        }, 90000);
    </script>
